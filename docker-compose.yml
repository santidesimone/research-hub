services:
  neo4j:
    image: neo4j:5-community
    container_name: research-hub-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt, used by ingest and web app
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-hubpassword}
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
