name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-password-1234
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-1234 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Offline tests (no database)
        run: npm test
        working-directory: web
      - name: Integration tests (real Neo4j)
        run: npm run test:integration
        working-directory: web
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-password-1234
          HUB_INTEGRATION: '1'

  # The real server on a real Neo4j: Playwright browser checks of the Library (owner, anonymous visitor, mobile width)
  # and the CLI end to end. The seed analyses two papers through the live Crossref and OpenAlex APIs.
  e2e:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-password-1234
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-1234 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      HUB_URL: http://127.0.0.1:18082
      HUB_PRIVATE_URL: http://127.0.0.1:18083
      HUB_API_TOKEN: ci-only-token-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Start the hub
        working-directory: web
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-password-1234
          PORT: '18082'
        run: |
          # two hubs on the same database: one with public access (the public preview checks), one without (the default).
          # The second starts once the first has applied the migrations.
          up() { for i in $(seq 1 60); do curl -fsS "$1/readyz" && return 0; sleep 1; done; cat /tmp/hub*.log; return 1; }
          PUBLIC_ACCESS=1 nohup node server.js > /tmp/hub.log 2>&1 &
          up "$HUB_URL"
          PORT=18083 nohup node server.js > /tmp/hub-private.log 2>&1 &
          up "$HUB_PRIVATE_URL"
      - name: playwright-core (outside the repo; not a project dependency)
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm install --no-audit --no-fund playwright-core@1.47.2
      - name: Browser checks (Library)
        working-directory: web
        env:
          NODE_PATH: /tmp/pw/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          OUT: /tmp/shots
        run: |
          mkdir -p "$OUT"
          node test/browser/seed.js
          node test/browser/private.js
          node test/browser/curation.js
          node test/browser/owner.js
          node test/browser/public-mobile.js
          node test/browser/publishing.js
      - name: CLI end to end
        working-directory: web
        run: node test/cli-e2e.js
      - name: Keep the server log and screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            /tmp/hub.log
            /tmp/shots

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-hub .
