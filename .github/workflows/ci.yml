name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-password-1234
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-1234 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Offline tests (no database)
        run: npm test
        working-directory: web
      - name: Integration tests (real Neo4j)
        run: npm run test:integration
        working-directory: web
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-password-1234
          HUB_INTEGRATION: '1'

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-hub .
